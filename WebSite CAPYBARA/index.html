<!DOCTYPE html>
<html lang="id" data-theme="cozy-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CapyLingo - Belajar Bahasa Inggris, Jepang, dan Mandarin se-santuy Capybara. Interaktif, bebas tekanan, dan bekerja offline." />
  <meta name="theme-color" content="#8C5A3C" />
  <title>CapyLingo</title>

  <style >
    
    /* KAMUS EKSPLORER & SEARCH BAR */
    .dict-search-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .dict-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding: 4px;
    }
    .dict-item {
      background-color: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .dict-item:hover {
      border-color: var(--brand-primary);
      background-color: var(--bg-elevated);
    }
    /* ==========================================================================
       1. BASE CSS — Design Tokens, 3 Tema Warna, Tipografi CJK & Reset
       ========================================================================== */
    :root,
    [data-theme="cozy-light"] {
      --bg-primary: #FDFBF7;
      --bg-surface: #F4EFE6;
      --bg-elevated: #FFFFFF;
      --bg-subtle: #EAE2D3;

      --brand-primary: #8C5A3C;
      --brand-primary-hover: #73472D;
      --brand-primary-soft: #F3E5D8;

      --brand-secondary: #F4A261;
      --brand-secondary-hover: #E78C42;
      --brand-secondary-soft: #FDEBD9;

      --accent-calm: #52796F;
      --accent-calm-soft: #DCE8E5;

      --text-primary: #2B2118;
      --text-secondary: #6E5D4F;
      --text-muted: #8E7D6F;
      --text-on-brand: #FFFFFF;

      --border-color: #DFD5C5;
      --border-strong: #C5B6A2;

      --status-success: #40916C;
      --status-success-bg: #D8F3DC;
      --status-error: #E07A5F;
      --status-error-bg: #FDE2DC;
      --status-warning: #E9C46A;
      --status-warning-bg: #FEF6DF;

      --shadow-sm: 0 2px 6px rgba(43, 33, 24, 0.06);
      --shadow-md: 0 6px 18px rgba(43, 33, 24, 0.09);
      --shadow-lg: 0 14px 32px rgba(43, 33, 24, 0.14);
      --focus-ring: 0 0 0 3px rgba(244, 162, 97, 0.55);
    }

    /* Tema 2: Forest Night (Dark Mode Nyaman di Mata) */
    [data-theme="forest-dark"] {
      --bg-primary: #1C1917;
      --bg-surface: #292524;
      --bg-elevated: #332E2C;
      --bg-subtle: #3F3936;

      --brand-primary: #C48F6E;
      --brand-primary-hover: #D5A384;
      --brand-primary-soft: #3D2F27;

      --brand-secondary: #F4A261;
      --brand-secondary-hover: #F7B27B;
      --brand-secondary-soft: #433022;

      --accent-calm: #74A59A;
      --accent-calm-soft: #233834;

      --text-primary: #F5F2EB;
      --text-secondary: #C7BEB2;
      --text-muted: #9A9083;
      --text-on-brand: #1C1917;

      --border-color: #443E3B;
      --border-strong: #5C544F;

      --status-success: #52B788;
      --status-success-bg: #1E3A2F;
      --status-error: #E07A5F;
      --status-error-bg: #422620;
      --status-warning: #E9C46A;
      --status-warning-bg: #3D351E;

      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 14px 32px rgba(0, 0, 0, 0.55);
      --focus-ring: 0 0 0 3px rgba(244, 162, 97, 0.65);
    }

    /* Tema 3: Matcha Breeze (Nuansa Hijau Sage Menenangkan) */
    [data-theme="matcha-breeze"] {
      --bg-primary: #F4F8F5;
      --bg-surface: #E6EFE9;
      --bg-elevated: #FFFFFF;
      --bg-subtle: #D5E4DA;

      --brand-primary: #4A7862;
      --brand-primary-hover: #3A614E;
      --brand-primary-soft: #D8EAE1;

      --brand-secondary: #F4A261;
      --brand-secondary-hover: #E38B45;
      --brand-secondary-soft: #FCEAD8;

      --accent-calm: #8C5A3C;
      --accent-calm-soft: #EFE3DA;

      --text-primary: #1E2D24;
      --text-secondary: #4B6355;
      --text-muted: #6E8778;
      --text-on-brand: #FFFFFF;

      --border-color: #C8DCD0;
      --border-strong: #A9C6B5;

      --status-success: #2D8A61;
      --status-success-bg: #D4F2E3;
      --status-error: #D96B4E;
      --status-error-bg: #FCE2DA;
      --status-warning: #E0B243;
      --status-warning-bg: #FDF4D7;
    }

    :root {
      --font-sans: "Plus Jakarta Sans", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-ja: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      --font-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 9999px;

      --transition-fast: 160ms cubic-bezier(0.22, 1, 0.36, 1);
      --transition-normal: 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color var(--transition-normal), color var(--transition-normal);
      overflow-x: hidden;
    }

    [lang="ja"],
    .text-ja {
      font-family: var(--font-ja);
      line-height: 1.5;
    }

    [lang="zh"],
    [lang="zh-CN"],
    .text-zh {
      font-family: var(--font-zh);
      line-height: 1.5;
    }

    .cjk-display {
      font-size: clamp(2.1rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.35;
    }

    .phonetic-text {
      font-family: var(--font-sans);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--brand-primary);
    }

    h1, h2, h3, h4 {
      color: var(--text-primary);
      line-height: 1.25;
      font-weight: 800;
    }

    h1 { font-size: clamp(1.45rem, 3vw, 2.05rem); }
    h2 { font-size: clamp(1.22rem, 2.4vw, 1.6rem); }
    h3 { font-size: clamp(1.05rem, 2vw, 1.25rem); }

    p { color: var(--text-secondary); }

    a {
      color: var(--brand-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--brand-primary);
      color: var(--text-on-brand);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      z-index: 9999;
      font-weight: 700;
    }

    .skip-link:focus { top: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. LAYOUT CSS — Struktur Mobile-First, Header, Navigasi & Grid Responsif
       ========================================================================== */
    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 84px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-elevated);
      border-bottom: 2px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      gap: 10px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--brand-secondary-soft);
      border: 2px solid var(--brand-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--brand-primary);
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .app-main {
      flex: 1;
      padding-top: 20px;
      padding-bottom: 32px;
    }

    .view-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--bg-elevated);
      border-top: 2px solid var(--border-color);
      box-shadow: 0 -4px 16px rgba(43, 33, 24, 0.06);
    }

    .nav-inner {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      padding: 6px 8px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.7rem;
      text-align: center;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .nav-item .nav-icon {
      font-size: 1.25rem;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background-color: var(--bg-surface);
      color: var(--brand-primary);
    }

    .nav-item.active {
      background-color: var(--brand-primary-soft);
      color: var(--brand-primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .hero-banner {
      background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--brand-primary-soft) 100%);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-md);
    }

    .hero-mascot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .hero-content-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .hero-banner {
        flex-direction: row;
        padding: 26px 30px;
      }
    }

    @media (min-width: 860px) {
      .app-shell { padding-bottom: 32px; }
      .app-nav {
        position: sticky;
        top: 68px;
        bottom: auto;
        border-top: none;
        border-bottom: 2px solid var(--border-color);
        box-shadow: none;
        background-color: var(--bg-surface);
      }
      .nav-inner {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 8px 16px;
      }
      .nav-item {
        flex-direction: row;
        gap: 8px;
        font-size: 0.9rem;
        padding: 8px 16px;
        border-radius: var(--radius-pill);
      }
      .nav-item .nav-icon {
        margin-bottom: 0;
        font-size: 1.15rem;
      }
    }

    @media (max-width: 420px) {
      .brand-subtitle { display: none; }
      .lang-info small { display: none; }
    }

    /* ==========================================================================
       3. COMPONENTS CSS — Kartu, Tombol, Badge, Onboarding, Modal & Toast
       ========================================================================== */
    .lang-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-pill);
      transition: transform var(--transition-fast), border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .lang-pill-btn:hover {
      border-color: var(--brand-primary);
      background-color: var(--brand-primary-soft);
    }

    .lang-flag {
      font-size: 1.25rem;
      line-height: 1;
    }

    .lang-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }

    .lang-info strong {
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .lang-info small {
      font-size: 0.68rem;
      color: var(--brand-primary);
      font-weight: 700;
    }

    .caret-icon {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-surface);
      border: 2px solid var(--border-color);
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .stat-pill:hover { border-color: var(--brand-secondary); }

    .level-tag {
      background-color: var(--brand-secondary);
      color: #2B2118;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
    }

    .icon-btn:hover {
      background-color: var(--brand-primary-soft);
      transform: scale(1.05);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 0.95rem;
      border: 2px solid transparent;
      transition: transform var(--transition-fast), background-color var(--transition-fast), box-shadow var(--transition-fast);
      text-align: center;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background-color: var(--brand-primary);
      color: var(--text-on-brand);
      box-shadow: 0 4px 0 var(--brand-primary-hover);
    }

    .btn-primary:hover { background-color: var(--brand-primary-hover); }

    .btn-secondary {
      background-color: var(--brand-secondary);
      color: #2B2118;
      box-shadow: 0 4px 0 var(--brand-secondary-hover);
    }

    .btn-secondary:hover { background-color: var(--brand-secondary-hover); }

    .btn-outline {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-outline:hover {
      border-color: var(--brand-primary);
      background-color: var(--brand-primary-soft);
    }

    .btn-calm {
      background-color: var(--accent-calm);
      color: #FFFFFF;
    }

    .btn-calm:hover { filter: brightness(1.08); }

    .btn-sm {
      padding: 7px 13px;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
    }

    .card {
      background-color: var(--bg-elevated);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .card-interactive:hover {
      transform: translateY(-3px);
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .speech-bubble {
      position: relative;
      background-color: var(--bg-elevated);
      border: 2px solid var(--brand-primary);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .speech-bubble .bara-name-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--brand-secondary-soft);
      color: var(--brand-primary);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      margin-bottom: 4px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background-color: var(--bg-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-calm), var(--brand-secondary));
      border-radius: var(--radius-pill);
      transition: width 350ms ease;
    }

    .lang-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background-color: var(--bg-elevated);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
    }

    .lang-card:hover {
      border-color: var(--brand-primary);
      background-color: var(--bg-surface);
    }

    .lang-card.selected {
      border-color: var(--brand-primary);
      background-color: var(--brand-primary-soft);
      box-shadow: 0 0 0 2px var(--brand-primary);
    }

    .lang-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lang-card-flag { font-size: 2rem; }

    .level-selector-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .level-option-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background-color: var(--bg-elevated);
      text-align: left;
      transition: all var(--transition-fast);
    }

    .level-option-btn:hover { border-color: var(--brand-secondary); }

    .level-option-btn.selected {
      border-color: var(--brand-primary);
      background-color: var(--brand-secondary-soft);
    }

    .level-std-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 800;
      background-color: var(--brand-primary);
      color: var(--text-on-brand);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .form-input {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-strong);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .form-input:focus {
      border-color: var(--brand-primary);
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .accessory-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border-color);
      background-color: var(--bg-elevated);
      font-weight: 700;
      font-size: 0.85rem;
      transition: all var(--transition-fast);
    }

    .chip-btn:hover { border-color: var(--brand-primary); }

    .chip-btn.active {
      background-color: var(--brand-primary);
      color: var(--text-on-brand);
      border-color: var(--brand-primary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background-color: rgba(28, 25, 23, 0.6);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      background-color: var(--bg-primary);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
    }

    .toast-container {
      position: fixed;
      bottom: 92px;
      right: 16px;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
    }

    .toast-item {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border-left: 6px solid var(--brand-primary);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      box-shadow: var(--shadow-md);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-banner {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background-color: var(--status-warning-bg);
      border: 2px solid var(--status-warning);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       4. ANIMATIONS CSS — Keyframes SVG Maskot Bara & Transisi Antarmuka
       ========================================================================== */
    .bara-svg-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      cursor: pointer;
    }

    .bara-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    @keyframes baraBreathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-2px) scaleY(1.025); }
    }

    @keyframes baraBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    @keyframes baraJumpHappy {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-10px) scale(1.04); }
      60% { transform: translateY(-6px) scale(1.02); }
    }

    @keyframes baraExcitedBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-3deg); }
      75% { transform: translateY(-8px) rotate(3deg); }
    }

    @keyframes baraEmpatheticTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4deg) translateY(2px); }
    }

    @keyframes baraThinkFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(3deg); }
    }

    @keyframes baraChew {
      0%, 100% { transform: scaleX(1) scaleY(1); }
      50% { transform: scaleX(1.06) scaleY(0.96); }
    }

    @keyframes yuzuBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(4deg); }
    }

    @keyframes floatUpFade {
      0% { opacity: 0; transform: translateY(6px) scale(0.8); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-16px) scale(1.15); }
    }

    .bara-svg .bara-body-group {
      transform-origin: center bottom;
      animation: baraBreathe 3.4s ease-in-out infinite;
    }

    .bara-svg .bara-eyes-blink {
      transform-origin: center;
      animation: baraBlink 4.2s infinite;
    }

    .bara-svg .bara-accessory-group {
      transform-origin: center bottom;
      animation: yuzuBob 3s ease-in-out infinite;
    }

    .bara-state-happy .bara-body-group {
      animation: baraJumpHappy 0.9s ease-in-out infinite;
    }

    .bara-state-excited .bara-body-group {
      animation: baraExcitedBounce 0.7s ease-in-out infinite;
    }

    .bara-state-sad .bara-body-group {
      animation: baraEmpatheticTilt 2.4s ease-in-out infinite;
    }

    .bara-state-thinking .bara-body-group {
      animation: baraThinkFloat 2s ease-in-out infinite;
    }

    .bara-state-chewing .bara-snout-group {
      transform-origin: center;
      animation: baraChew 0.45s ease-in-out infinite;
    }

    .bara-state-sleepy .bara-float-particle {
      animation: floatUpFade 2.6s ease-in-out infinite;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .view-enter {
      animation: viewFadeIn 240ms ease-out;
    }

    /* ==========================================================================
       5. LEARN & QUIZ CSS (TAHAP 2) — Flashcard 3D, Topik, Kana Chart & Kuis
       ========================================================================== */
    .topic-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      background-color: var(--bg-elevated);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .topic-card:hover {
      transform: translateY(-3px);
      border-color: var(--brand-primary);
      box-shadow: var(--shadow-md);
    }

    .topic-card.completed {
      border-color: var(--status-success);
      background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--status-success-bg) 160%);
    }

    .topic-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background-color: var(--brand-secondary-soft);
      border: 2px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    /* FLASHCARD 3D CONTAINER */
    .flashcard-stage {
      perspective: 1200px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .flashcard-3d {
      position: relative;
      width: 100%;
      min-height: 360px;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      user-select: none;
    }

    .flashcard-3d.is-flipped {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: var(--bg-elevated);
      border: 3px solid var(--brand-primary);
      border-radius: var(--radius-lg);
      padding: 26px 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: linear-gradient(165deg, var(--bg-elevated) 0%, var(--bg-surface) 100%);
      border-color: var(--accent-calm);
    }

    .flashcard-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .flashcard-main-word {
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .script-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 800;
      background-color: var(--brand-primary-soft);
      color: var(--brand-primary);
    }

    .tone-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 800;
      background-color: var(--accent-calm-soft);
      color: var(--accent-calm);
    }

    .tts-btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .example-box {
      width: 100%;
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-top: 10px;
      text-align: left;
    }

    .phonetic-fallback-box {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background-color: var(--brand-secondary-soft);
      border: 1.5px dashed var(--brand-primary);
      font-size: 0.84rem;
      color: var(--text-primary);
    }

    /* TABEL KANA (HIRAGANA & KATAKANA) */
    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .kana-cell {
      padding: 10px 6px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      border: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
    }

    .kana-cell:hover {
      transform: translateY(-2px);
      border-color: var(--brand-primary);
      background-color: var(--brand-primary-soft);
    }

    .kana-char {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .kana-romaji {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* KUIS AKHIR PELAJARAN */
    .quiz-option-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-strong);
      background-color: var(--bg-elevated);
      text-align: left;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all var(--transition-fast);
    }

    .quiz-option-btn:hover:not(:disabled) {
      border-color: var(--brand-primary);
      background-color: var(--brand-primary-soft);
      transform: translateX(4px);
    }

    .quiz-option-btn.correct {
      border-color: var(--status-success);
      background-color: var(--status-success-bg);
      color: #1B4332;
    }

    .quiz-option-btn.wrong {
      border-color: var(--status-error);
      background-color: var(--status-error-bg);
      color: #6B271A;
    }

   /* ==========================================================================
       6. MINI GAMES & PROGRESS CSS (TAHAP 3) — 4 Game Interaktif & Dashboard Progres
       ========================================================================== */
    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 18px;
    }

    .hud-stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-primary);
      background-color: var(--bg-elevated);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-color);
    }

    /* MEMORY MATCH GRID */
    .memory-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .memory-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .memory-grid.cols-5 {
      grid-template-columns: repeat(4, 1fr);
    }

    @media (min-width: 640px) {
      .memory-grid.cols-5 {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .mem-card {
      position: relative;
      min-height: 92px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-strong);
      background-color: var(--brand-primary-soft);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-weight: 800;
      transition: transform var(--transition-fast), background-color var(--transition-fast), border-color var(--transition-fast);
      user-select: none;
    }

    .mem-card:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--brand-primary);
    }

    .mem-card.is-open {
      background-color: var(--bg-elevated);
      border-color: var(--brand-secondary);
    }

    .mem-card.is-matched {
      background-color: var(--status-success-bg);
      border-color: var(--status-success);
      color: #1B4332;
      cursor: default;
    }

    /* SUSUN KALIMAT (SENTENCE BUILDER) */
    .sentence-slot {
      min-height: 68px;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 2.5px dashed var(--brand-primary);
      background-color: var(--bg-primary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
    }

    .word-bank-slot {
      min-height: 64px;
      padding: 14px;
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
      border: 2px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .word-chip {
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-elevated);
      border: 2px solid var(--brand-primary);
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 3px 0 var(--border-strong);
      transition: transform var(--transition-fast), background-color var(--transition-fast);
    }

    .word-chip:hover {
      background-color: var(--brand-secondary-soft);
      transform: translateY(-2px);
    }

    /* CAPYBARA CATCH ARENA */
    .catch-arena {
      position: relative;
      width: 100%;
      height: 390px;
      background: linear-gradient(180deg, var(--accent-calm-soft) 0%, var(--bg-surface) 82%, var(--brand-primary-soft) 100%);
      border: 3px solid var(--brand-primary);
      border-radius: var(--radius-lg);
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .catch-target-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background-color: var(--bg-elevated);
      border: 2px solid var(--brand-primary);
      border-radius: var(--radius-pill);
      padding: 6px 20px;
      box-shadow: var(--shadow-md);
      text-align: center;
      white-space: nowrap;
    }

    .falling-word-item {
      position: absolute;
      z-index: 3;
      background-color: var(--bg-elevated);
      border: 2px solid var(--brand-secondary);
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .catch-player {
      position: absolute;
      bottom: 6px;
      z-index: 4;
      transform: translateX(-50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .catch-basket-label {
      margin-top: -12px;
      background-color: var(--brand-primary);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
    }

    /* HALAMAN PROGRES, GRAFIK 7 HARI & LENCANA */
    .badge-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background-color: var(--bg-elevated);
      transition: transform var(--transition-fast);
    }

    .badge-card.unlocked {
      border-color: var(--brand-secondary);
      background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--brand-secondary-soft) 150%);
    }

    .badge-card.locked {
      opacity: 0.58;
      filter: grayscale(0.75);
    }

    .badge-icon-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      border: 2px solid var(--brand-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      flex-shrink: 0;
    }

    .week-chart-box {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      align-items: end;
      height: 150px;
      padding: 18px 10px 6px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-color);
    }

    .week-bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 6px;
    }

    .week-bar-fill {
      width: 100%;
      max-width: 38px;
      background: linear-gradient(180deg, var(--brand-secondary) 0%, var(--brand-primary) 100%);
      border-radius: 8px 8px 4px 4px;
      min-height: 6px;
      transition: height 400ms ease;
    }

    /* ==========================================================================
       7. CAPYBARA CHILL ZONE CSS (TAHAP 4) — Onsen Scene, Mixer & Break Timer
       ========================================================================== */
    .chill-scene-card {
      position: relative;
      border-radius: var(--radius-lg);
      border: 3px solid var(--brand-primary);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      background-color: var(--bg-elevated);
    }

    .chill-svg-stage {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      user-select: none;
    }

    .chill-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background-color: var(--bg-elevated);
      border-top: 2px solid var(--border-color);
    }

    .chill-action-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ANIMASI ELEMEN ALAM CHILL ZONE */
    @keyframes steamRise {
      0% {
        opacity: 0;
        transform: translateY(8px) scaleX(0.9);
      }
      45% {
        opacity: 0.65;
      }
      100% {
        opacity: 0;
        transform: translateY(-34px) scaleX(1.15);
      }
    }

    @keyframes yuzuBobWater {
      0%, 100% {
        transform: translateY(0px) rotate(-3deg);
      }
      50% {
        transform: translateY(4px) rotate(4deg);
      }
    }

    @keyframes rippleWave {
      0%, 100% {
        transform: scaleX(1);
        opacity: 0.55;
      }
      50% {
        transform: scaleX(1.08);
        opacity: 0.85;
      }
    }

    @keyframes butterflyFlutter {
      0%, 100% {
        transform: translate(0px, 0px) rotate(-4deg);
      }
      25% {
        transform: translate(18px, -12px) rotate(8deg);
      }
      50% {
        transform: translate(34px, -4px) rotate(-6deg);
      }
      75% {
        transform: translate(16px, 8px) rotate(6deg);
      }
    }

    @keyframes rainDropFall {
      0% {
        transform: translateY(-20px) translateX(4px);
        opacity: 0;
      }
      30% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(240px) translateX(-12px);
        opacity: 0;
      }
    }

    @keyframes starTwinkle {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes onsenBaraBreathe {
      0%, 100% {
        transform: translateY(0px) scale(1, 1);
      }
      50% {
        transform: translateY(2px) scale(1.015, 0.985);
      }
    }

    .onsen-steam-1 { animation: steamRise 3.8s ease-in-out infinite; }
    .onsen-steam-2 { animation: steamRise 4.4s ease-in-out 1.2s infinite; }
    .onsen-steam-3 { animation: steamRise 3.5s ease-in-out 2.3s infinite; }

    .onsen-yuzu-float {
      transform-origin: center;
      animation: yuzuBobWater 3.2s ease-in-out infinite;
    }

    .onsen-water-ripple {
      transform-origin: center;
      animation: rippleWave 4s ease-in-out infinite;
    }

    .onsen-butterfly {
      animation: butterflyFlutter 9s ease-in-out infinite;
    }

    .onsen-rain-line {
      animation: rainDropFall 1.1s linear infinite;
    }

    .onsen-star {
      transform-origin: center;
      animation: starTwinkle 2.8s ease-in-out infinite;
    }

    .onsen-bara-body {
      transform-origin: 400px 300px;
      animation: onsenBaraBreathe 4.2s ease-in-out infinite;
    }

    /* AUDIO MIXER SLIDERS & TIMER */
    .mixer-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .mixer-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      border: 1px solid var(--border-strong);
      outline: none;
      cursor: pointer;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--brand-primary);
      border: 2px solid #FFFFFF;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }

    (function (window) {

      var memoryStore = {};
      var isLocalStorageAvailable = false;

      try {
        var testKey = '__capylingo_test__';

      function loadState() {
        try {
          var raw = isLocalStorageAvailable
            ? window.localStorage.getItem(STORAGE_KEY)

          if (!raw) return null;

          var serialized = JSON.stringify(stateObj);

          }

        }
        if (!candidate.settings || typeof candidate.settings !== 'object') {
          return { valid: false, reason: 'Data pengaturan tidak lengkap.' };
        }
        return { valid: true };
      }

      function exportToJsonFile(currentState) {

          var exportPayload = JSON.parse(JSON.stringify(currentState));

          var jsonString = JSON.stringify(exportPayload, null, 2);
          var blob = new Blob([jsonString], { type: 'application/json' });
          var url = URL.createObjectURL(blob);

          var dateStr = new Date().toISOString().slice(0, 10);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'capylingo-backup-' + dateStr + '.json';

          a.click();

          URL.revokeObjectURL(url);
          return true;
        } catch (err) {
          console.error('[CapyStorage] Gagal mengekspor JSON:', err);
          return false;
        }
      }

        isPersistent: isLocalStorageAvailable,
        loadState: loadState,
        saveState: saveState,
        clearState: clearState,
        validateImportedData: validateImportedData,
        exportToJsonFile: exportToJsonFile

    })(window);

      }

      function getYesterdayLocalStr() {
        var d = new Date();
        d.setDate(d.getDate() - 1);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function awardXp(amount, langCode) {
        var xpGain = Math.max(0, Number(amount) || 0);
        var targetLang = langCode || state.profile.activeLanguage;

        state.progress.totalXp += xpGain;
        state.progress.level = Math.floor(state.progress.totalXp / 200) + 1;

        if (state.progress.languages[targetLang]) {
          state.progress.languages[targetLang].xp += xpGain;
        }

        var today = getTodayLocalStr();
        var yesterday = getYesterdayLocalStr();
        var lastDate = state.progress.streak.lastActiveDate;

        if (lastDate !== today) {
          if (lastDate === yesterday) {
            state.progress.streak.current += 1;
          } else {
            state.progress.streak.current = 1;
          }
          state.progress.streak.lastActiveDate = today;
          if (state.progress.streak.current > state.progress.streak.longest) {
            state.progress.streak.longest = state.progress.streak.current;

        }

        var historyList = state.progress.studyHistory;
        var todayEntry = null;
        for (var i = 0; i < historyList.length; i++) {
          if (historyList[i].date === today) {
            todayEntry = historyList[i];
            break;

        }
        if (todayEntry) {
          todayEntry.xpEarned += xpGain;
          todayEntry.activitiesCompleted += 1;
        } else {
          historyList.push({
            date: today,
            xpEarned: xpGain,
            activitiesCompleted: 1
          });
          if (historyList.length > 30) {
            historyList.shift();
          }
        }

        unlockBadge('first_step');
        if (state.progress.streak.current >= 3) {

        persistAndNotify();
        return {

      function getPawsByExpressionSvg(expression) {

          '</g>';

        var restRight =
          '<g class="bara-PawRestR">' +

            '<path d="M 137,165 L 137,159 M 144,165 L 144,159" stroke="#432818" stroke-width="2.8" stroke-linecap="round" />' +

        // Tangan terangkat melambai ke atas (pangkal menempel di bahu bawah, jari bulat di ujung atas)
        var waveRightUp =
          '<g class="bara-PawWaveR">' +
            '<path d="M 138,142 C 146,128 154,108 166,110 C 176,112 174,130 156,146" fill="#C49060" stroke="#432818" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />' +
            '<path d="M 163,111 L 159,117 M 170,115 L 165,120" stroke="#432818" stroke-width="2.6" stroke-linecap="round" />' +
          '</g>';

        var waveLeftUp =
          '<g class="bara-PawWaveL">' +
            '<path d="M 86,142 C 78,128 70,108 58,110 C 48,112 50,130 68,146" fill="#C49060" stroke="#432818" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />' +
            '<path d="M 61,111 L 65,117 M 54,115 L 59,120" stroke="#432818" stroke-width="2.6" stroke-linecap="round" />' +
          '</g>';

        switch (expression) {
          case 'thinking':
            // Tangan kiri diam di bantal, tangan kanan NAIK dari bahu kanan (148,148) ke dagu (114,122)
            // Ujung bulat + garis jari berada di bagian ATAS menyentuh dagu!
            return (

              '<g class="bara-PawThinkR">' +
                '<path d="M 134,150 C 122,142 110,131 113,121 C 116,112 130,115 142,128 C 149,136 152,145 150,152" fill="#C49060" stroke="#432818" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />' +

                '<path d="M 115,118 L 121,123 M 121,115 L 126,121" stroke="#432818" stroke-width="2.6" stroke-linecap="round" />' +
              '</g>'
            );

          case 'chewing':
            // Kedua tangan merangkul dari bahu kiri & kanan ke tengah memegang semangka
            // Ujung bulat + garis jari menghadap ke DALAM menyentuh semangka!
            return (
              '<!-- Potongan Semangka Segar -->' +
              '<g class="bara-SnackSlice">' +
                '<path d="M 92,143 L 130,143 L 111,118 Z" fill="#E07A5F" stroke="#432818" stroke-width="3" stroke-linejoin="round" />' +
                '<path d="M 92,143 Q 111,151 130,143" fill="none" stroke="#52B788" stroke-width="5" stroke-linecap="round" />' +
                '<circle cx="107" cy="133" r="1.5" fill="#2B2118" />' +
                '<circle cx="115" cy="134" r="1.5" fill="#2B2118" />' +
                '<circle cx="111" cy="127" r="1.4" fill="#2B2118" />' +
              '</g>' +
              '<!-- Tangan Kiri Memegang Sisi Kiri Semangka (Jari di ujung kanan-dalam) -->' +
              '<g class="bara-PawSnackL">' +
                '<path d="M 72,148 C 74,134 88,126 99,131 C 106,135 104,147 94,151 C 86,154 77,153 72,148 Z" fill="#C49060" stroke="#432818" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />' +
                '<path d="M 102,135 L 96,137 M 102,141 L 96,142" stroke="#432818" stroke-width="2.6" stroke-linecap="round" />' +
              '</g>' +
              '<!-- Tangan Kanan Memegang Sisi Kanan Semangka (Jari di ujung kiri-dalam) -->' +
              '<g class="bara-PawSnackR">' +
                '<path d="M 150,148 C 148,134 134,126 123,131 C 116,135 118,147 128,151 C 136,154 145,153 150,148 Z" fill="#C49060" stroke="#432818" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />' +
                '<path d="M 120,135 L 126,137 M 120,141 L 126,142" stroke="#432818" stroke-width="2.6" stroke-linecap="round" />' +
              '</g>'
            );

          case 'happy':
            // Tangan kiri santai di bantal, tangan kanan melambai di atas
            return restLeft + waveRightUp;

          case 'excited':
            // Kedua tangan terangkat melambai gembira
            return waveLeftUp + waveRightUp;

          case 'sad':
          case 'sleepy':
          case 'idle':
          default:
            return restLeft + restRight;
        }
      }

      function renderAlphabetSection(langCode, langLocale) {
        var config = BEGINNER_ALPHABET_DB[langCode] || BEGINNER_ALPHABET_DB.en;
        var currentTab = activeAlphaTab[langCode] || config.tabs[0].id;

        var tabsHtml = '';
        for (var i = 0; i < config.tabs.length; i++) {
          var t = config.tabs[i];
          var isAct = currentTab === t.id ? 'active' : '';
          tabsHtml +=
            '<button type="button" class="chip-btn ' + isAct + '" data-alpha-tab="' + t.id + '">' +
              t.label +
            '</button>';
        }
        if (currentTab !== 'none') {
          tabsHtml += '<button type="button" class="chip-btn" data-alpha-tab="none">Tutup Tabel ✕</button>';
        }

        var cellsHtml = '';
        if (currentTab !== 'none' && config.data[currentTab]) {
          var items = config.data[currentTab];
          for (var j = 0; j < items.length; j++) {
            var item = items[j];
            cellsHtml +=
              '<button type="button" class="kana-cell" data-alpha-tts="' + item.tts + '" data-alpha-tip="' + item.tip + '" title="' + item.tip + '">' +
                '<span class="kana-char" lang="' + langCode + '" style="font-size:1.3rem;">' + item.char + '</span>' +
                '<span class="kana-romaji" style="margin-top:2px;">' + item.read + '</span>' +
              '</button>';
          }
        }

        return (
          '<section class="card" aria-label="Tabel Ejaan Huruf Pemula">' +
            '<div class="section-header" style="margin-bottom:8px;">' +
              '<div>' +
                '<h2>' + config.title + '</h2>' +
                '<p style="font-size:0.86rem;">' + config.subtitle + '</p>' +
              '</div>' +
              '<div class="accessory-grid">' + tabsHtml + '</div>' +
            '</div>' +
            (currentTab !== 'none'
              ? '<div class="kana-grid" style="grid-template-columns:repeat(auto-fill, minmax(105px, 1fr));">' + cellsHtml + '</div>'
              : '') +
          '</section>'
        );
      }

      function renderCatalog(container) {
        var state = window.CapyState.getState();
        var langMeta = window.CapyState.getActiveLanguageMeta();
        var levelMeta = window.CapyState.getActiveLevelMeta();
        var currentLevelId = state.profile.activeLevels[langMeta.code] || 'beginner';
        var topics = window.CapyVocab.getTopics(langMeta.code, currentLevelId);
        var langProgress = state.progress.languages[langMeta.code];
        var hasVoice = window.CapyTTS.hasVoiceForLocale(langMeta.locale);
        var allLangWords = window.CapyVocab.getAllWordsForLang(langMeta.code, 'all');

        var levelTabsHtml = '';
        var lvKeys = ['beginner', 'intermediate', 'advanced'];
        for (var i = 0; i < lvKeys.length; i++) {

          levelTabsHtml +=
            '<button type="button" class="chip-btn ' + isAct + '" data-learn-level="' + lk + '">' +

                var secondCard = deck[openedIndices[1]];

                if (firstCard.pairId === secondCard.pairId) {
                  matchedPairIds.push(firstCard.pairId);
                  openedIndices = [];
                  lockBoard = false;
                  baraMood = 'happy';
                  window.CapyAudio.playSfx('correct');

                  if (matchedPairIds.length >= pairCount) {
                    var finalScore = Math.max(100, (pairCount * 50) - (moves * 5) - secondsElapsed);
                    renderEndScreen(container, {
                      gameKey: 'memoryMatch',
                      isWin: true,
                      score: finalScore,
                      diffLabel: diffLabel,
                      xp: 60,
                      summaryText: 'Semua ' + pairCount + ' pasang kartu berhasil dicocokkan dalam ' + moves + ' langkah (' + secondsElapsed + ' detik)!',

                    });
                    return;
                  }
                  paintBoard();
                } else {
                  baraMood = 'thinking';
                  setTimeout(function () {
                    openedIndices = [];
                    lockBoard = false;
                    paintBoard();
                  }, 750);
                }
              }
            });
          }
        }

        paintBoard();
      }

      /* -------------------- GAME 4: CAPYBARA CATCH (TANGKAP KATA) -------------------- */
      function renderCapyCatch(container) {
        cleanupActiveGame();
        var state = window.CapyState.getState();
        var langMeta = window.CapyState.getActiveLanguageMeta();
        var currentLevel = state.profile.activeLevels[langMeta.code] || 'beginner';
        var wordsPool = shuffle(window.CapyVocab.getAllWordsForLang(langMeta.code, currentLevel));
        var diffLabel = selectedDifficulty === 'easy' ? 'Mudah' : (selectedDifficulty === 'medium' ? 'Sedang' : 'Sulit');

        var fallSpeedBase = selectedDifficulty === 'easy' ? 1.15 : (selectedDifficulty === 'medium' ? 1.65 : 2.25);

        var score = 0;
        var hearts = 3;
        var playerX = 50; // Posisi persentase horizontal (10% - 90%)
        var currentPromptWord = wordsPool[0];
        var fallingItems = [];
        var spawnCounter = 0;
        var isGameOver = false;

        function pickNewPrompt() {
          currentPromptWord = wordsPool[Math.floor(Math.random() * wordsPool.length)];
          var promptTermEl = document.getElementById('catch-prompt-term');
          var promptPhonEl = document.getElementById('catch-prompt-phon');
          if (promptTermEl) promptTermEl.textContent = currentPromptWord.term;
          if (promptPhonEl) promptPhonEl.textContent = '[' + currentPromptWord.phonetic + ']';
        }

        container.innerHTML =
          '<section class="card">' +
            '<div class="game-hud">' +
              '<a href="#/game" class="btn btn-outline btn-sm">✕ Keluar</a>' +
              '<span class="hud-stat" id="catch-hearts-el">❤️❤️❤️</span>' +
              '<span class="hud-stat" id="catch-score-el">⭐ Skor: 0 / ' + targetScore + '</span>' +
            '</div>' +

            '<div class="catch-arena" id="catch-arena-box">' +
              '<div class="catch-target-banner">' +
                '<div style="font-size:0.72rem;color:var(--text-muted);font-weight:700;">TANGKAP ARTI KATA INI:</div>' +
                '<div style="font-size:1.35rem;font-weight:800;color:var(--brand-primary);" id="catch-prompt-term" lang="' + langMeta.code + '">' + currentPromptWord.term + '</div>' +
                '<div style="font-size:0.78rem;font-weight:700;" id="catch-prompt-phon">[' + currentPromptWord.phonetic + ']</div>' +
              '</div>' +

              '<div id="catch-items-layer"></div>' +

              '<div class="catch-player" id="catch-player-el" style="left:50%;">' +
                window.CapyMascot.renderBaraSvg({ expression: 'excited', size: 86 }) +
                '<span class="catch-basket-label">🧺 Keranjang Bara</span>' +
              '</div>' +
            '</div>' +

            '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;">' +
              '<button type="button" class="btn btn-outline" id="btn-catch-left" style="flex:1;">◀ Geser Kiri</button>' +
              '<button type="button" class="btn btn-secondary btn-sm" id="btn-catch-tts">🔊 Dengar Kata</button>' +
              '<button type="button" class="btn btn-outline" id="btn-catch-right" style="flex:1;">Geser Kanan ▶</button>' +
            '</div>' +
          '</section>';

        var arenaBox = document.getElementById('catch-arena-box');
        var playerEl = document.getElementById('catch-player-el');
        var itemsLayer = document.getElementById('catch-items-layer');

        function movePlayer(deltaPct) {
          playerX = Math.max(12, Math.min(88, playerX + deltaPct));
          if (playerEl) playerEl.style.left = playerX + '%';
        }

        // Kontrol Tombol Layar
        var btnL = document.getElementById('btn-catch-left');
        var btnR = document.getElementById('btn-catch-right');
        var btnTts = document.getElementById('btn-catch-tts');
        if (btnL) btnL.addEventListener('click', function () { movePlayer(-12); });
        if (btnR) btnR.addEventListener('click', function () { movePlayer(12); });
        if (btnTts) {
          btnTts.addEventListener('click', function () {
            window.CapyTTS.speak(currentPromptWord.term, langMeta.locale, 1.0);
          });
        }

        // Kontrol Geser Mouse / Touch langsung di Arena
        if (arenaBox) {
          arenaBox.addEventListener('pointermove', function (ev) {
            var rect = arenaBox.getBoundingClientRect();
            var relX = ((ev.clientX - rect.left) / rect.width) * 100;
            playerX = Math.max(12, Math.min(88, relX));
            if (playerEl) playerEl.style.left = playerX + '%';
          });
        }

        // Kontrol Keyboard Panah Kiri/Kanan
        activeKeyHandler = function (ev) {
          if (ev.key === 'ArrowLeft') {
            ev.preventDefault();
            movePlayer(-9);
          } else if (ev.key === 'ArrowRight') {
            ev.preventDefault();
            movePlayer(9);
          }
        };
        window.addEventListener('keydown', activeKeyHandler);

        function spawnItem() {
          var isCorrectItem = Math.random() < 0.48;
          var wordObj = isCorrectItem
            ? currentPromptWord
            : wordsPool[Math.floor(Math.random() * wordsPool.length)];
          var fruits = ['🍊', '🍉', '🍎', '🍃'];
          var icon = fruits[Math.floor(Math.random() * fruits.length)];

          var el = document.createElement('div');
          el.className = 'falling-word-item';
          el.textContent = icon + ' ' + wordObj.meaningId;
          var startX = 15 + Math.random() * 70;
          el.style.left = startX + '%';
          el.style.top = '58px';

          if (itemsLayer) itemsLayer.appendChild(el);

          fallingItems.push({
            el: el,
            x: startX,
            y: 58,
            speed: fallSpeedBase + Math.random() * 0.55,
            meaningId: wordObj.meaningId
          });
        }

        function updateGameLoop() {
          if (isGameOver) return;

          spawnCounter++;
          if (spawnCounter % 75 === 0 || fallingItems.length === 0) {
            spawnItem();
          }

          for (var i = fallingItems.length - 1; i >= 0; i--) {
            var item = fallingItems[i];
            item.y += item.speed;
            item.el.style.top = item.y + 'px';

            // Cek Tumbukan dengan Keranjang Bara (y antara 285px - 345px)
            if (item.y >= 285 && item.y <= 345 && Math.abs(item.x - playerX) < 16) {
              var caughtRight = item.meaningId === currentPromptWord.meaningId;
              if (caughtRight) {
                score += 20;
                window.CapyAudio.playSfx('correct');
                pickNewPrompt();
              } else {
                hearts -= 1;
                window.CapyAudio.playSfx('wrong');
              }

              if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
              fallingItems.splice(i, 1);

              var scoreEl = document.getElementById('catch-score-el');
              var heartsEl = document.getElementById('catch-hearts-el');
              if (scoreEl) scoreEl.textContent = '⭐ Skor: ' + score + ' / ' + targetScore;
              if (heartsEl) {
                var hStr = '';
                for (var h = 0; h < 3; h++) hStr += h < hearts ? '❤️' : '🤍';
                heartsEl.textContent = hStr;
              }

              if (score >= targetScore || hearts <= 0) {
                isGameOver = true;
                renderEndScreen(container, {
                  gameKey: 'capyCatch',
                  isWin: score >= targetScore,
                  score: score,
                  diffLabel: diffLabel,
                  xp: score >= targetScore ? 60 : 25,
                  summaryText: score >= targetScore
                    ? 'Keranjang Bara penuh dengan kosakata yang tepat! Refleksmu mantap sekali!'
                    : 'Bara sudah kenyang menangkap buah kata. Yuk main lagi!',
                  onReplay: function () { renderCapyCatch(container); }
                });
                return;
              }
              continue;
            }

            // Hapus jika lewat batas bawah
            if (item.y > 385) {
              if (item.el.parentNode) item.el.parentNode.removeChild(item.el);
              fallingItems.splice(i, 1);
            }
          }

          activeAnimFrameId = requestAnimationFrame(updateGameLoop);
        }

        activeAnimFrameId = requestAnimationFrame(updateGameLoop);
      }

      function render(container, gameId) {
        if (gameId === 'guess') renderTebakKata(container);
        else if (gameId === 'match') renderMemoryMatch(container);
        else if (gameId === 'build') renderSusunKalimat(container);
        else if (gameId === 'catch') renderCapyCatch(container);
        else renderLobby(container);
      }

      window.CapyGames = {
        render: render,
        cleanup: cleanupActiveGame
      };
    })(window);

      /**
       * Instrumen 1: Soft Lo-Fi Drum (Kick & Brush Snare/Hat)
       */
      function triggerSoftDrum(ctx, type, vol) {
        var now = ctx.currentTime;
        if (type === 'kick') {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(115, now);
          osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);
          gain.gain.setValueAtTime(vol * 0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
          registerTempNode({ osc: osc, gain: gain, ctx: ctx });
        } else if (type === 'snare' || type === 'hat') {
          var bufSize = Math.floor(ctx.sampleRate * (type === 'snare' ? 0.12 : 0.05));
          var buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var i = 0; i < bufSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.4));
          }
          var noise = ctx.createBufferSource();
          noise.buffer = buffer;

          var filter = ctx.createBiquadFilter();
          filter.type = type === 'snare' ? 'bandpass' : 'highpass';
          filter.frequency.setValueAtTime(type === 'snare' ? 1400 : 5200, now);

          var g = ctx.createGain();
          var level = type === 'snare' ? vol * 0.12 : vol * 0.05;
          g.gain.setValueAtTime(level, now);
          g.gain.exponentialRampToValueAtTime(0.0008, now + (type === 'snare' ? 0.11 : 0.045));

          noise.connect(filter);
          filter.connect(g);
          g.connect(ctx.destination);
          noise.start(now);
          registerTempNode({ osc: noise, gain: g, ctx: ctx });
        }
      }

      /**

       */
      function triggerNote(ctx, freq, durationSec, vol, timbre, delaySec) {
        var now = ctx.currentTime + (delaySec || 0);
        var osc = ctx.createOscillator();
        var osc2 = ctx.createOscillator();
        var filter = ctx.createBiquadFilter();
        var gain = ctx.createGain();

        filter.type = 'lowpass';

        if (timbre === 'rhodes') {
          osc.type = 'triangle';
          osc2.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now); // Harmonik oktaf lembut
          filter.frequency.setValueAtTime(1600, now);

          gain.gain.setValueAtTime(0.0008, now);
          gain.gain.linearRampToValueAtTime(vol * 0.11, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
        } else if (timbre === 'piano') {
          osc.type = 'triangle';
          osc2.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 1.001, now);
          filter.frequency.setValueAtTime(2800, now);
          filter.frequency.exponentialRampToValueAtTime(650, now + durationSec);

          gain.gain.setValueAtTime(0.0008, now);
          gain.gain.linearRampToValueAtTime(vol * 0.15, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
        } else if (timbre === 'koto') {
          osc.type = 'sawtooth';
          osc2.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 0.5, now);
          filter.frequency.setValueAtTime(2400, now);
          filter.frequency.exponentialRampToValueAtTime(420, now + durationSec * 0.85);

          gain.gain.setValueAtTime(0.0008, now);
          gain.gain.linearRampToValueAtTime(vol * 0.12, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
        } else if (timbre === 'pad') {
          osc.type = 'sine';
          osc2.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 1.003, now);
          filter.frequency.setValueAtTime(900, now);

          gain.gain.setValueAtTime(0.0008, now);
          gain.gain.linearRampToValueAtTime(vol * 0.075, now + durationSec * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
        } else if (timbre === 'bass') {
          osc.type = 'sine';
          osc2.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq, now);
          filter.frequency.setValueAtTime(320, now);

          gain.gain.setValueAtTime(0.0008, now);
          gain.gain.linearRampToValueAtTime(vol * 0.18, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);

        osc2Gain.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc2.start(now);
        osc.stop(now + durationSec + 0.04);
        osc2.stop(now + durationSec + 0.04);

        registerTempNode({ osc: osc, gain: gain, ctx: ctx });
        registerTempNode({ osc: osc2, gain: gain, ctx: ctx });
      }

      /**
       * Mesin Sequencer 16-Step untuk Memainkan 3 Trek Berbeda
       */
      function runSequencerStep() {
        if (!isLofiPlaying) return;
        var state = window.CapyState.getState();
        if (state.settings.audio.masterMuted) return;

        var vol = state.settings.audio.lofiVolume !== undefined ? state.settings.audio.lofiVolume : 0.65;
        if (vol <= 0.01) return;

        var ctx = window.CapyAudio.getContext();
        if (!ctx) return;

        var track = LOFI_TRACKS[currentTrackIndex] || LOFI_TRACKS[0];
        var stepInBar = currentStep % 16;
        var barIdx = Math.floor(currentStep / 16) % 4;
        var chord = track.chords[barIdx];
        var bassNote = track.bass[barIdx];
        var melodyRow = track.melodyPattern[barIdx];
        var stepSec = track.stepMs / 1000;

        if (track.style === 'lofi_beat') {
          // 1. Strum Akor Rhodes hangat pada ketukan ke-0 dan ke-8
          if (stepInBar === 0 || stepInBar === 8) {
            for (var c = 0; c < chord.length; c++) {
              triggerNote(ctx, chord[c], stepSec * 7.2, vol * 0.75, 'rhodes', c * 0.045);
            }
          }
          // 2. Sub-bass pada ketukan 0 dan 10
          if (stepInBar === 0 || stepInBar === 10) {
            triggerNote(ctx, bassNote, stepSec * 5.5, vol * 0.85, 'bass', 0);
          }
          // 3. Ketukan Drum Lo-Fi Lembut (Kick di 0 & 10, Snare di 4 & 12, Hat di genap)
          if (stepInBar === 0 || stepInBar === 10) triggerSoftDrum(ctx, 'kick', vol);
          if (stepInBar === 4 || stepInBar === 12) triggerSoftDrum(ctx, 'snare', vol);
          if (stepInBar % 2 === 0) triggerSoftDrum(ctx, 'hat', vol);

          // 4. Melodi Utama Rhodes
          var mFreq = melodyRow[stepInBar];
          if (mFreq > 0) {
            triggerNote(ctx, mFreq, stepSec * 2.6, vol * 1.05, 'piano', 0);
          }
        } else if (track.style === 'piano_lullaby') {
          // 1. Arpeggio Piano Mengalir di setiap ketukan genap (tanpa drum)
          if (stepInBar === 0) {
            triggerNote(ctx, bassNote, stepSec * 14, vol * 0.8, 'bass', 0);
          }
          if (stepInBar % 2 === 0) {
            var arpIdx = (stepInBar / 2) % chord.length;
            triggerNote(ctx, chord[arpIdx], stepSec * 4.5, vol * 0.7, 'piano', 0);
          }
          // 2. Melodi Music Box Jernih
          var lullabyFreq = melodyRow[stepInBar];
          if (lullabyFreq > 0) {
            triggerNote(ctx, lullabyFreq, stepSec * 3.2, vol * 1.1, 'piano', 0);
          }
        } else if (track.style === 'japanese_zen') {
          // 1. Drone Ambient Pad Lembut di awal bar
          if (stepInBar === 0) {
            triggerNote(ctx, bassNote, stepSec * 15, vol * 0.75, 'pad', 0);
            for (var z = 0; z < chord.length; z++) {
              triggerNote(ctx, chord[z], stepSec * 14, vol * 0.65, 'pad', z * 0.12);
            }
          }
          // 2. Petikan Harpa Koto Pentatonik Jepang
          var kotoFreq = melodyRow[stepInBar];
          if (kotoFreq > 0) {
            triggerNote(ctx, kotoFreq, stepSec * 2.8, vol * 1.05, 'koto', 0);
          }
        }

        currentStep++;
      }

      function startLofiMusic() {
        stopLofiMusic();
        isLofiPlaying = true;
        currentStep = 0;
        var track = LOFI_TRACKS[currentTrackIndex] || LOFI_TRACKS[0];
        runSequencerStep();
        stepTimerId = setInterval(runSequencerStep, track.stepMs);
      }

      function stopLofiMusic() {
        isLofiPlaying = false;
        if (stepTimerId) {
          clearInterval(stepTimerId);
          stepTimerId = null;
        }

      /**

      function createNoiseLoop(ctx, filterFreq, isBrown, masterDest) {
        var bufferSize = ctx.sampleRate * 2;
