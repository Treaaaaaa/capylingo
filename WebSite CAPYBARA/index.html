          var white = Math.random() * 2 - 1;
          if (isBrown) {
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 2.2;
          } else {
            output[i] = white * 0.3;
          }
        }

        var noise = ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        var filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, ctx.currentTime);

        var gainNode = ctx.createGain();
        gainNode.gain.setValueAtTime(0.0, ctx.currentTime);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(masterDest);
        noise.start(0);

        return { source: noise, gain: gainNode };
      }

      function playBirdChirp() {
        if (!isAmbientActive) return;
        var state = window.CapyState.getState();
        if (state.settings.audio.masterMuted) return;
        var birdVol = (state.settings.audio.ambientMix && state.settings.audio.ambientMix.birds) || 0;
        if (birdVol <= 0.02) return;

        var ctx = window.CapyAudio.getContext();
        if (!ctx) return;

        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';

        var baseFreq = 2000 + Math.random() * 600;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.25, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.95, now + 0.16);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(birdVol * 0.11, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      function syncAmbientMixer() {
        var state = window.CapyState.getState();
        var mix = state.settings.audio.ambientMix || { rain: 0.4, river: 0.3, birds: 0 };
        var shouldMute = !isAmbientActive || state.settings.audio.masterMuted;

        var ctx = window.CapyAudio.getContext();
        if (!ctx) return;

        if (!ambientNodes.masterGain) {
          ambientNodes.masterGain = ctx.createGain();
          ambientNodes.masterGain.gain.setValueAtTime(0, ctx.currentTime);
          ambientNodes.masterGain.connect(ctx.destination);
        }

        if (!ambientNodes.rainSource && isAmbientActive) {
          var rNode = createNoiseLoop(ctx, 800, false, ambientNodes.masterGain);
          ambientNodes.rainSource = rNode.source;
          ambientNodes.rainGain = rNode.gain;
        }
        if (!ambientNodes.riverSource && isAmbientActive) {
          var rvNode = createNoiseLoop(ctx, 380, true, ambientNodes.masterGain);
          ambientNodes.riverSource = rvNode.source;
          ambientNodes.riverGain = rvNode.gain;
        }

        var now = ctx.currentTime;
        ambientNodes.masterGain.gain.cancelScheduledValues(now);
        ambientNodes.masterGain.gain.setValueAtTime(shouldMute ? 0 : 1, now);

        if (ambientNodes.rainGain) {
          ambientNodes.rainGain.gain.cancelScheduledValues(now);
          ambientNodes.rainGain.gain.setValueAtTime(shouldMute ? 0 : mix.rain * 0.22, now);
        }
        if (ambientNodes.riverGain) {
          ambientNodes.riverGain.gain.cancelScheduledValues(now);
          ambientNodes.riverGain.gain.setValueAtTime(shouldMute ? 0 : mix.river * 0.25, now);
        }

        if (!shouldMute && mix.birds > 0.02 && !ambientNodes.birdIntervalId) {
          ambientNodes.birdIntervalId = setInterval(function () {
            if (Math.random() < 0.65) playBirdChirp();
          }, 2600);
        } else if ((shouldMute || mix.birds <= 0.02) && ambientNodes.birdIntervalId) {
          clearInterval(ambientNodes.birdIntervalId);
          ambientNodes.birdIntervalId = null;
        }
      }

       * Mematikan SELURUH suara (baik Musik Lo-Fi maupun Suara Alam) secara instan
       */
      function stopAllChillAudio() {
        stopLofiMusic();
        isAmbientActive = false;
        if (ambientNodes.birdIntervalId) {
          clearInterval(ambientNodes.birdIntervalId);
          ambientNodes.birdIntervalId = null;
        }
        var ctx = window.CapyAudio ? window.CapyAudio.getContext() : null;
        if (ctx && ambientNodes.masterGain) {
          var now = ctx.currentTime;
          ambientNodes.masterGain.gain.cancelScheduledValues(now);
          ambientNodes.masterGain.gain.setValueAtTime(0, now);
        }
      }

    (function (window) {

      function checkDailyReminder() {
        var state = window.CapyState.getState();
        var rem = state.settings.reminder;
        if (!rem || !rem.enabled) return;

        var todayStr = new Date().toISOString().slice(0, 10);
        if (rem.lastNotifiedDate === todayStr) return;

        var lastActive = state.progress.streak.lastActiveDate;
        if (lastActive === todayStr) return; // Sudah belajar hari ini

        // Tampilkan Banner Fallback di Beranda / Bagian atas aplikasi
        var slot = document.getElementById('top-notification-slot');
        if (slot) {
          slot.innerHTML =
            '<div class="info-banner" style="background:var(--brand-secondary-soft);border-color:var(--brand-secondary);">' +
              '<span>🍊 <strong>Halo ' + state.profile.name + '!</strong> Bara menunggumu buat latihan santai 5 kata hari ini yuk!</span>' +
              '<a href="#/belajar" class="btn btn-primary btn-sm">Mulai Belajar Sekarang</a>' +
            '</div>';
        }

        // Coba Web Notification API jika diizinkan
        if (window.Notification && Notification.permission === 'granted') {
          try {
            new Notification('CapyLingo 🍊', {
              body: 'Waktunya belajar santuy bersama Bara hari ini!',
              icon: ''
            });
            rem.lastNotifiedDate = todayStr;
            window.CapyState.save();
          } catch (e) {
            console.warn('[Reminder] Gagal memicu Web Notification:', e);
          }
        }
      }

      function requestPermission() {
        if (!window.Notification) {
          if (window.CapyApp) window.CapyApp.showToast('Browser ini tidak mendukung Web Notification.', '⚠️');
          return;
        }
        Notification.requestPermission().then(function (permission) {
          if (permission === 'granted') {
            window.CapyState.updateSettings({ reminder: { enabled: true } });
            if (window.CapyApp) window.CapyApp.showToast('Izin notifikasi berhasil diaktifkan!', '🔔');
          } else {
            if (window.CapyApp) window.CapyApp.showToast('Izin notifikasi ditolak oleh browser.', '⚠️');
          }
        });
      }

      window.CapyReminder = {
        check: checkDailyReminder,
        requestPermission: requestPermission
      };
    })(window);

              window.CapyRouter.refresh();
              var updatedLang = window.CapyState.getActiveLanguageMeta();
              var updatedLvl = window.CapyState.getActiveLevelMeta();
              showToast('Aktif: ' + updatedLang.name + ' — ' + updatedLvl.label + ' (' + updatedLvl.standard + ')', updatedLang.flag);
            });
          }
        }

        renderModalContent();
        modal.classList.remove('hidden');
      }

      function closeLanguageModal() {
        var modal = document.getElementById('lang-selector-modal');
        if (modal) modal.classList.add('hidden');
      }

      function renderStageFallback(container, title, stageNumber, desc) {
        container.innerHTML =
          '<section class="card" style="text-align:center;padding:36px 20px;">' +
            window.CapyMascot.renderBaraSvg({ expression: 'thinking', size: 130 }) +
            '<h1 style="margin-top:12px;">' + title + '</h1>' +
            '<p style="max-width:520px;margin:8px auto 20px;">' + desc + '</p>' +
            '<span class="level-std-badge" style="font-size:0.85rem;padding:6px 14px;">Menunggu Modul Tahap ' + stageNumber + '</span>' +
            '<div style="margin-top:22px;">' +
              '<a href="#/home" class="btn btn-primary">← Kembali ke Beranda</a>' +
            '</div>' +
          '</section>';
      }

      function initApp() {
        if (!window.CapyStorage.isPersistent) {
          var slot = document.getElementById('top-notification-slot');
          if (slot) {
            slot.innerHTML =
              '<div class="info-banner">' +
                '<span>⚠️ Browser membatasi localStorage. Data sesi tetap berjalan di memori sementara. Gunakan fitur Ekspor JSON untuk menyimpan progresmu.</span>' +
              '</div>';
          }
        }

        var btnLangModal = document.getElementById('btn-open-lang-modal');
        if (btnLangModal) btnLangModal.addEventListener('click', openLanguageModal);

        var btnCloseModal = document.getElementById('btn-close-lang-modal');
        if (btnCloseModal) btnCloseModal.addEventListener('click', closeLanguageModal);

        var modalBackdrop = document.getElementById('lang-selector-modal');
        if (modalBackdrop) {
          modalBackdrop.addEventListener('click', function (e) {
            if (e.target === modalBackdrop) closeLanguageModal();
          });
        }

        var btnQuickTheme = document.getElementById('btn-quick-theme');
        if (btnQuickTheme) {
          btnQuickTheme.addEventListener('click', function () {
            var themes = ['cozy-light', 'forest-dark', 'matcha-breeze'];
            var labels = {
              'cozy-light': 'Tema Cozy Cream (Terang)',
              'forest-dark': 'Tema Forest Night (Gelap)',
              'matcha-breeze': 'Tema Matcha Breeze (Hijau Sage)'
            };
            var current = window.CapyState.getState().settings.theme;
            var nextIdx = (themes.indexOf(current) + 1) % themes.length;
            var nextTheme = themes[nextIdx];
            window.CapyState.setTheme(nextTheme);
            syncHeaderUI();
            showToast(labels[nextTheme], '🎨');
          });
        }

        window.CapyRouter.register('onboarding', renderOnboardingView);
        window.CapyRouter.register('home', renderHomeView);

        window.CapyRouter.register('belajar', function (container, param) {
          if (window.CapyLearn && typeof window.CapyLearn.render === 'function') {
            window.CapyLearn.render(container, param);
          } else {
            renderStageFallback(container, 'Halaman Belajar & Flashcard', 2, 'Modul kosakata 3 bahasa, flashcard 3D, Web Speech API TTS, dan kuis akhir pelajaran akan ditambahkan ke dalam index.html pada Tahap 2.');
          }
        });

        window.CapyRouter.register('kuis', function (container, param) {
          if (window.CapyQuiz && typeof window.CapyQuiz.render === 'function') {
            window.CapyQuiz.render(container, param);
          } else {
            renderStageFallback(container, 'Kuis Akhir Pelajaran', 2, 'Modul kuis interaktif akan ditambahkan pada Tahap 2.');
          }
        });

        window.CapyRouter.register('game', function (container, param) {
          if (window.CapyGames && typeof window.CapyGames.render === 'function') {
            window.CapyGames.render(container, param);
          } else {
            renderStageFallback(container, 'Arena Mini Game Capybara', 3, '4 Mini Game (Tebak Kata, Memory Match, Susun Kalimat, dan Capy Catch) akan ditambahkan pada Tahap 3.');
          }
        });

        window.CapyRouter.register('chill', function (container) {
          if (window.CapyChill && typeof window.CapyChill.render === 'function') {
            window.CapyChill.render(container);
          } else {
            renderStageFallback(container, 'Capybara Chill Zone', 4, 'Simulasi pemandian air panas interaktif, musik lo-fi Web Audio, mixer suara alam, dan timer istirahat akan ditambahkan pada Tahap 4.');
          }
        });

        window.CapyRouter.register('progres', function (container) {
          if (window.CapyProgress && typeof window.CapyProgress.render === 'function') {
            window.CapyProgress.render(container);
          } else {
            renderStageFallback(container, 'Progres, Streak & Lencana', 3, 'Statistik belajar lengkap, kalender streak harian, dan koleksi lencana akan ditambahkan pada Tahap 3.');
          }
        });

        window.CapyRouter.register('pengaturan', function (container) {
          if (window.CapySettings && typeof window.CapySettings.render === 'function') {
            window.CapySettings.render(container);
          } else {
            renderStageFallback(container, 'Pengaturan Profil & Akun Lokal', 5, 'Pengaturan profil lengkap, pengingat belajar, serta ekspor/impor file JSON akan ditambahkan pada Tahap 5.');
          }
        });

        window.CapyState.subscribe(syncHeaderUI);
        syncHeaderUI();
        window.CapyRouter.init();
      }

      window.CapyApp = {
        showToast: showToast,
        syncHeaderUI: syncHeaderUI,
        openLanguageModal: openLanguageModal
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })(window);
  </script>
</body>
</html>
